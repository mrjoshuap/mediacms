apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mediacms

# Reference the base configuration
resources:
- ../../base

# Patch the image ConfigMap to use mediacms-full instead of mediacms-base
patches:
- patch: |-
    - op: replace
      path: /data/image
      value: mediacms-full:latest
  target:
    kind: ConfigMap
    name: mediacms-image-config

# Re-apply replacements to ensure the patched ConfigMap value is used
# Replacements are processed after patches, so this will use the updated ConfigMap value
replacements:
- source:
    kind: ConfigMap
    name: mediacms-image-config
    fieldPath: data.image
  targets:
  - select:
      kind: Deployment
    fieldPaths:
    - spec.template.spec.containers.[name=mediacms].image
  - select:
      kind: Job
    fieldPaths:
    - spec.template.spec.containers.[name=mediacms].image

# Add example-specific labels
labels:
- includeSelectors: true
  pairs:
    app.kubernetes.io/environment: example-full
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: mediacms
    app.kubernetes.io/part-of: mediacms
