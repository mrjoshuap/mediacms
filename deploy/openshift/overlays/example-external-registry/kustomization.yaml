apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mediacms

# Reference the base configuration
resources:
- ../../base

# Patch the image ConfigMap to use an external registry image
# Example: quay.io/example/mediacms:1.0.0
# Replace with your actual registry and image path
patches:
- patch: |-
    - op: replace
      path: /data/image
      value: quay.io/example/mediacms:1.0.0
  target:
    kind: ConfigMap
    name: mediacms-image-config

# Re-apply replacements to ensure the patched ConfigMap value is used
replacements:
- source:
    kind: ConfigMap
    name: mediacms-image-config
    fieldPath: data.image
  targets:
  - select:
      kind: Deployment
    fieldPaths:
    - spec.template.spec.containers.0.image
  - select:
      kind: Job
    fieldPaths:
    - spec.template.spec.containers.0.image

# Add example-specific labels
labels:
- includeSelectors: true
  pairs:
    app.kubernetes.io/environment: example-external-registry
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: mediacms
    app.kubernetes.io/part-of: mediacms
