# This is a template file for creating secrets
# DO NOT commit actual secrets to Git
# 
# To create the actual secret, use:
#   oc create secret generic mediacms-secrets \
#     --from-literal=DB_USER='mediacms' \
#     --from-literal=SECRET_KEY='your-secret-key-here' \
#     --from-literal=DB_PASSWORD='your-db-password' \
#     --from-literal=ADMIN_PASSWORD='your-admin-password' \
#     --namespace=mediacms
#
# Or use kubectl:
#   kubectl create secret generic mediacms-secrets \
#     --from-literal=DB_USER='mediacms' \
#     --from-literal=SECRET_KEY='your-secret-key-here' \
#     --from-literal=DB_PASSWORD='your-db-password' \
#     --from-literal=ADMIN_PASSWORD='your-admin-password' \
#     --namespace=mediacms
#
# Then label it for ArgoCD:
#   oc label secret mediacms-secrets app.kubernetes.io/name=mediacms app.kubernetes.io/part-of=mediacms app.kubernetes.io/managed-by=argocd -n mediacms

apiVersion: v1
kind: Secret
metadata:
  name: mediacms-secrets
  namespace: mediacms
  labels:
    app.kubernetes.io/name: mediacms
    app.kubernetes.io/part-of: mediacms
    app.kubernetes.io/managed-by: argocd
type: Opaque
stringData:
  # Django Secret Key - CHANGE THIS!
  # Generate with: python -c "from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())"
  SECRET_KEY: "CHANGE_ME_GENERATE_NEW_SECRET_KEY"
  
  # Database Credentials
  DB_USER: "mediacms"
  DB_PASSWORD: "CHANGE_ME_DATABASE_PASSWORD"
  
  # Admin User Credentials
  ADMIN_USER: "admin"
  ADMIN_EMAIL: "admin@example.com"
  ADMIN_PASSWORD: "CHANGE_ME_ADMIN_PASSWORD"
  
  # Optional: Email Configuration (if using SMTP)
  # EMAIL_HOST: "smtp.example.com"
  # EMAIL_PORT: "587"
  # EMAIL_HOST_USER: "noreply@example.com"
  # EMAIL_HOST_PASSWORD: "CHANGE_ME_EMAIL_PASSWORD"
  # EMAIL_USE_TLS: "True"
  
  # Optional: API Keys and Tokens
  # OPENAI_API_KEY: "CHANGE_ME_IF_USING_WHISPER"
  # OTHER_API_KEY: "CHANGE_ME"
