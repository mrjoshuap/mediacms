user www-data;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 10240;
}

worker_rlimit_nofile 20000;  # each connection needs a filehandle (or 2 if you are proxying)

http {
    # Proxy timeouts for large file uploads and long-running requests
    proxy_connect_timeout 300;
    proxy_send_timeout 12000;
    proxy_read_timeout 12000;
    proxy_buffering off;
    proxy_request_buffering off;
    
    # Client body settings for large uploads
    client_max_body_size 5800M;
    client_body_buffer_size 128k;
    client_body_timeout 12000;
    
    # Request limits
    large_client_header_buffers 4 32k;
    client_header_buffer_size 16k;
    
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    access_log /var/log/mediacms/nginx.access.log;
    error_log /var/log/mediacms/nginx.error.log warn;

    gzip on;
    gzip_disable "msie6";

    log_format compression '$remote_addr - $remote_user [$time_local] '
                           '"$request" $status $body_bytes_sent '
                           '"$http_referer" "$http_user_agent" "$gzip_ratio"';

    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    include /etc/nginx/conf.d/*.conf;
}
