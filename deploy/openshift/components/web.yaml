apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: mediacms
  labels:
    app.kubernetes.io/name: mediacms
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: mediacms
    app.kubernetes.io/managed-by: argocd
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
  selector:
    app.kubernetes.io/name: mediacms
    app.kubernetes.io/component: web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: mediacms
  labels:
    app.kubernetes.io/name: mediacms
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: mediacms
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mediacms
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mediacms
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: mediacms
        app.kubernetes.io/managed-by: argocd
    spec:
      initContainers:
      - name: wait-for-db
        image: postgres:17.2-alpine
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          until pg_isready -h db -U "${DB_USER}" -d "${DB_NAME}"; do
            echo "Waiting for database to be ready..."
            sleep 2
          done
          echo "Database is ready!"
        env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: mediacms-secrets
              key: DB_USER
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: mediacms-config
              key: DB_NAME
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: mediacms-secrets
              key: DB_PASSWORD
      - name: wait-for-redis
        image: redis:alpine
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          until redis-cli -h redis ping | grep -q PONG; do
            echo "Waiting for Redis to be ready..."
            sleep 2
          done
          echo "Redis is ready!"
      - name: wait-for-migrations
        image: quay.io/openshift/origin-cli:latest
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          echo "Waiting for migrations job to complete..."
          # Wait for job to exist first
          while ! oc get job migrations -n mediacms &>/dev/null; do
            echo "Migrations job not yet created, waiting..."
            sleep 5
          done
          # Wait for job to complete
          until oc get job migrations -n mediacms -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}' 2>/dev/null | grep -q "True"; do
            FAILED=$(oc get job migrations -n mediacms -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null || echo "")
            if [ "$FAILED" = "True" ]; then
              echo "ERROR: Migrations job failed!" >&2
              exit 1
            fi
            echo "Migrations job not yet complete, waiting..."
            sleep 5
          done
          echo "Migrations job completed successfully!"
      containers:
      - name: mediacms
        image: image-registry.openshift-image-registry.svc:5000/mediacms/mediacms-base:latest
        imagePullPolicy: IfNotPresent
        command: ["./deploy/openshift/scripts/entrypoint.sh"]
        args: ["./deploy/openshift/scripts/start.sh"]
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        env:
        - name: ENABLE_UWSGI
          value: "no"
        - name: ENABLE_NGINX
          value: "yes"
        - name: ENABLE_CELERY_BEAT
          value: "no"
        - name: ENABLE_CELERY_SHORT
          value: "no"
        - name: ENABLE_CELERY_LONG
          value: "no"
        - name: ENABLE_MIGRATIONS
          value: "no"
        envFrom:
        - configMapRef:
            name: mediacms-config
        - secretRef:
            name: mediacms-secrets
        volumeMounts:
        - name: media-storage
          mountPath: /home/mediacms.io/mediacms/media_files
        - name: local-settings
          mountPath: /home/mediacms.io/mediacms/cms/local_settings.py
          subPath: local_settings.py
          readOnly: true
        - name: web-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        - name: nginx-uwsgi-params
          mountPath: /etc/nginx/sites-enabled/uwsgi_params
          subPath: uwsgi_params
          readOnly: true
        - name: imagemagick-policy
          mountPath: /etc/ImageMagick-6/policy.xml
          subPath: policy.xml
          readOnly: true
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: media-storage
        persistentVolumeClaim:
          claimName: media-files-pvc
      - name: local-settings
        configMap:
          name: mediacms-config
      - name: web-config
        configMap:
          name: web-config
      - name: nginx-uwsgi-params
        configMap:
          name: web-config
      - name: imagemagick-policy
        configMap:
          name: imagemagick-policy
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
