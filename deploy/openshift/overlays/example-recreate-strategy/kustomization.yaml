apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mediacms

# Reference the base configuration
resources:
- ../../base

# Apply patches for custom deployment strategies
patches:
- path: patches/recreate-strategy.yaml

# Add example-specific labels
labels:
- includeSelectors: true
  pairs:
    app.kubernetes.io/environment: example-recreate-strategy
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: mediacms
    app.kubernetes.io/part-of: mediacms
