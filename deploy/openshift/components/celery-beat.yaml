apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: mediacms
  labels:
    app.kubernetes.io/name: mediacms
    app.kubernetes.io/component: celery-beat
    app.kubernetes.io/part-of: mediacms
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mediacms
      app.kubernetes.io/component: celery-beat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mediacms
        app.kubernetes.io/component: celery-beat
        app.kubernetes.io/part-of: mediacms
        app.kubernetes.io/managed-by: argocd
    spec:
      initContainers:
      - name: wait-for-db
        image: postgres:17.2-alpine
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          until pg_isready -h db -U "${DB_USER}" -d "${DB_NAME}"; do
            echo "Waiting for database to be ready..."
            sleep 2
          done
          echo "Database is ready!"
        env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: mediacms-secrets
              key: DB_USER
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: mediacms-config
              key: DB_NAME
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: mediacms-secrets
              key: DB_PASSWORD
      - name: wait-for-redis
        image: redis:alpine
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          until redis-cli -h redis ping | grep -q PONG; do
            echo "Waiting for Redis to be ready..."
            sleep 2
          done
          echo "Redis is ready!"
      - name: wait-for-migrations
        image: quay.io/openshift/origin-cli:latest
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          set -uo pipefail
          echo "Waiting for migrations job to complete..."
          # Wait for job to exist first
          MAX_WAIT=300
          ELAPSED=0
          while ! oc get job migrations -n mediacms &>/dev/null; do
            if [ $ELAPSED -ge $MAX_WAIT ]; then
              echo "ERROR: Timeout waiting for migrations job to be created" >&2
              exit 1
            fi
            echo "Migrations job not yet created, waiting... (${ELAPSED}s)"
            sleep 5
            ELAPSED=$((ELAPSED + 5))
          done
          echo "Migrations job found, waiting for completion..."
          # Wait for job to complete
          ELAPSED=0
          while true; do
            if [ $ELAPSED -ge $MAX_WAIT ]; then
              echo "ERROR: Timeout waiting for migrations job to complete" >&2
              oc get job migrations -n mediacms -o yaml >&2 || true
              exit 1
            fi
            # Check if job completed successfully
            COMPLETE=$(oc get job migrations -n mediacms -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}' 2>/dev/null || echo "")
            if [ "$COMPLETE" = "True" ]; then
              echo "Migrations job completed successfully!"
              exit 0
            fi
            # Check if job failed
            FAILED=$(oc get job migrations -n mediacms -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null || echo "")
            if [ "$FAILED" = "True" ]; then
              echo "ERROR: Migrations job failed!" >&2
              oc get job migrations -n mediacms -o yaml >&2 || true
              exit 1
            fi
            echo "Migrations job not yet complete, waiting... (${ELAPSED}s)"
            sleep 5
            ELAPSED=$((ELAPSED + 5))
          done
      containers:
      - name: mediacms
        image: image-registry.openshift-image-registry.svc:5000/mediacms/mediacms-base:latest
        imagePullPolicy: Always
        command: ["/bin/bash", "./deploy/openshift/scripts/entrypoint.sh"]
        args: ["./deploy/openshift/scripts/start.sh"]
        env:
        - name: ENABLE_UWSGI
          value: "no"
        - name: ENABLE_NGINX
          value: "no"
        - name: ENABLE_CELERY_BEAT
          value: "yes"
        - name: ENABLE_CELERY_SHORT
          value: "no"
        - name: ENABLE_CELERY_LONG
          value: "no"
        - name: ENABLE_MIGRATIONS
          value: "no"
        envFrom:
        - configMapRef:
            name: mediacms-config
        - secretRef:
            name: mediacms-secrets
        volumeMounts:
        - name: media-files
          mountPath: /home/mediacms.io/mediacms/media_files
        - name: local-settings
          mountPath: /home/mediacms.io/mediacms/cms/local_settings.py
          subPath: local_settings.py
          readOnly: true
        - name: imagemagick-policy
          mountPath: /etc/ImageMagick-6/policy.xml
          subPath: policy.xml
          readOnly: true
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "ps aux | grep -v grep | grep celery.*beat || exit 1"
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "ps aux | grep -v grep | grep celery.*beat || exit 1"
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: media-files
        persistentVolumeClaim:
          claimName: media-files-pvc
      - name: local-settings
        configMap:
          name: mediacms-config
      - name: imagemagick-policy
        configMap:
          name: imagemagick-policy
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
