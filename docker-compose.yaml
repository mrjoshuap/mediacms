services:
  migrations:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    image: mediacms/mediacms:latest
    user: "33:33"
    command: ["/bin/sh", "/home/mediacms.io/mediacms/scripts/run-migrations.sh"]
    environment:
      ADMIN_USER: 'admin'
      ADMIN_EMAIL: 'admin@localhost'
      # ADMIN_PASSWORD: 'uncomment_and_set_password_here'
    restart: "no"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - ./custom:/home/mediacms.io/mediacms/custom:ro
      - static_files:/home/mediacms.io/mediacms/static
      - media_files:/home/mediacms.io/mediacms/media_files
      - logs:/home/mediacms.io/mediacms/logs

  api:
    image: mediacms/mediacms:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    expose:
      - "8000"
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - ./custom:/home/mediacms.io/mediacms/custom:ro
      - static_files:/home/mediacms.io/mediacms/static
      - media_files:/home/mediacms.io/mediacms/media_files
      - logs:/home/mediacms.io/mediacms/logs
    healthcheck:
      test: ["CMD", "/usr/bin/wget", "--spider", "--quiet", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  nginx:
    image: mediacms/mediacms-nginx:latest
    build:
      context: .
      dockerfile: Dockerfile.nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./custom/static:/var/www/custom:ro
      - static_files:/var/www/static:ro
      - media_files:/var/www/media:ro
      - logs:/var/log/mediacms
    healthcheck:
      test: ["CMD", "/usr/bin/wget", "--spider", "--quiet", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery_beat:
    image: mediacms/mediacms-worker:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    restart: unless-stopped
    command: ["/home/mediacms.io/bin/celery", "-A", "cms", "beat", "--loglevel=INFO", "--schedule=/var/lib/mediacms/celerybeat-schedule"]
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - ./custom:/home/mediacms.io/mediacms/custom:ro
      - media_files:/home/mediacms.io/mediacms/media_files
      - celerybeat_data:/var/lib/mediacms
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat' > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  celery_short:
    image: mediacms/mediacms-worker:latest
    restart: unless-stopped
    environment:
      CELERY_SHORT_SOFT_TIME_LIMIT: ${CELERY_SHORT_SOFT_TIME_LIMIT:-300}
    command: 
      - /bin/sh
      - -c
      - /home/mediacms.io/bin/celery -A cms worker -Q short_tasks -c 10 --soft-time-limit=$${CELERY_SHORT_SOFT_TIME_LIMIT} --loglevel=INFO -n short@%h
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - ./custom:/home/mediacms.io/mediacms/custom:ro
      - media_files:/home/mediacms.io/mediacms/media_files
      - logs:/home/mediacms.io/mediacms/logs
    healthcheck:
      test: ["CMD", "/home/mediacms.io/bin/celery", "-A", "cms", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery_long:
    image: mediacms/mediacms-worker:latest
    # To use extra codecs, change image to: mediacms/mediacms-worker:latest-full
    # and update build target to worker-full
    restart: unless-stopped
    command: ["/home/mediacms.io/bin/celery", "-A", "cms", "worker", "-Q", "long_tasks", "-c", "1", "-Ofair", "--prefetch-multiplier=1", "--loglevel=INFO", "-n", "long@%h"]
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - ./custom:/home/mediacms.io/mediacms/custom:ro
      - media_files:/home/mediacms.io/mediacms/media_files
      - logs:/home/mediacms.io/mediacms/logs
    healthcheck:
      test: ["CMD", "/home/mediacms.io/bin/celery", "-A", "cms", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  db:
    image: postgres:17.2-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mediacms
      POSTGRES_PASSWORD: mediacms
      POSTGRES_DB: mediacms
      TZ: Europe/London
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  static_files:
  media_files:
  logs:
  celerybeat_data:
