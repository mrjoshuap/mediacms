apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mediacms

# Reference the base configuration
resources:
- ../../base

# Patches for ArgoCD Application
  
  
patches:
  # Patch Application to use fork repository and deploy/openshift-4.19 branch
- patch: |-
    - op: replace
      path: /spec/source/repoURL
      value: https://github.com/mrjoshuap/mediacms.git
    - op: replace
      path: /spec/source/targetRevision
      value: deploy/openshift-4.19
  target:
    kind: Application
    name: mediacms
  # Patch BuildConfig base to use fork repository and deploy/openshift-4.19 branch
- patch: |-
    - op: replace
      path: /spec/source/git/uri
      value: https://github.com/mrjoshuap/mediacms.git
    - op: replace
      path: /spec/source/git/ref
      value: deploy/openshift-4.19
  target:
    kind: BuildConfig
    name: mediacms-base

# Add dev-specific labels
labels:
- includeSelectors: true
  pairs:
    app.kubernetes.io/environment: dev
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: mediacms
    app.kubernetes.io/part-of: mediacms
