apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mediacms-dev

# Reference the base configuration
resources:
- ../../base

  # Patch BuildConfig base to use fork repository and deploy/openshift-4.19 branch
patches:
- patch: |-
    - op: replace
      path: /spec/source/git/uri
      value: https://github.com/mrjoshuap/mediacms.git
    - op: replace
      path: /spec/source/git/ref
      value: deploy/openshift-4.19
  target:
    kind: BuildConfig
    name: mediacms-base
- path: patches/route.yaml
- path: patches/replicas.yaml
- path: patches/resources.yaml
- path: patches/storage.yaml

# Add dev-specific labels
labels:
- includeSelectors: true
  pairs:
    app.kubernetes.io/environment: dev
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: mediacms
    app.kubernetes.io/part-of: mediacms
