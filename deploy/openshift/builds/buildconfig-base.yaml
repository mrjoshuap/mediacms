apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: mediacms-base
  namespace: mediacms
  labels:
    app.kubernetes.io/name: mediacms
    app.kubernetes.io/part-of: mediacms
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: build
spec:
  runPolicy: Serial
  source:
    type: Git
    git:
      uri: https://github.com/mediacms-io/mediacms.git
      ref: main
    contextDir: .
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile.openshift
      buildArgs:
        - name: DEVELOPMENT_MODE
          value: "False"
  output:
    to:
      kind: ImageStreamTag
      name: mediacms-base:latest
  resources:
    limits:
      cpu: "2"
      memory: 4Gi
    requests:
      cpu: "1"
      memory: 2Gi
  triggers:
    - type: ConfigChange
    - type: ImageChange
      imageChange: {}
    - type: GitHub
      github:
        secret: github-webhook-secret
      # Note: Webhook secret must be created separately
      # oc create secret generic github-webhook-secret --from-literal=WebHookSecretKey=your-secret -n mediacms
