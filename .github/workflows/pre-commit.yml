name: pre-commit

on:
  workflow_call:

jobs:
  pre-commit:
    name: Pre-Commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install frontend dependencies
        run: |
          # frontend/package-lock.json is gitignored; use npm install there.
          npm install --prefix frontend
          npm ci --prefix frontend-tools/video-js
          npm ci --prefix frontend-tools/video-editor
          npm ci --prefix frontend-tools/chapters-editor

      - uses: pre-commit/action@v3.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
