# Docker Compose override file for Whisper transcription support
# This file enables Whisper transcription capabilities by using the worker-full build target
# which includes openai-whisper and other extra codecs.
#
# Usage:
#   docker compose -f docker-compose.yaml -f docker-compose.full.yaml up
#
# Or use Makefile targets:
#   make up-full
#
# Note: Also set USE_WHISPER_TRANSCRIBE = True in your settings/local_settings.py

services:
  celery_long:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker-full
    image: mediacms/mediacms-worker:latest-full
    volumes:
      - ./custom:/home/mediacms.io/mediacms/custom:ro
      - media_files:/home/mediacms.io/mediacms/media_files
      - logs:/home/mediacms.io/mediacms/logs
      - whisper_models:/home/mediacms.io/whisper_models

volumes:
  whisper_models:
