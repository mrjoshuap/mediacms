name: Documentation

# Branch roles (set as GitHub Actions repository variables when forking):
#   MEDIACMS_STABLE_BRANCH  — production line (default: main)
#   MEDIACMS_BETA_BRANCH    — beta / next line (default: mediacms-next)
# Triggers list both names so forks work before variables exist.
# `on:` cannot read vars, so keep the branch list in sync with those defaults.

on:
  push:
    branches: [main, mediacms-next]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  STABLE_BRANCH: ${{ vars.MEDIACMS_STABLE_BRANCH || 'main' }}
  BETA_BRANCH: ${{ vars.MEDIACMS_BETA_BRANCH || 'mediacms-next' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install docs tools
        run: pip install -r requirements-docs.txt

      - name: Install app dependencies for OpenAPI export
        run: |
          pip install -r requirements.txt
        continue-on-error: true

      - name: Resolve docs channel
        id: channel
        run: |
          REF="${{ github.ref }}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            CHANNEL=pr
          elif [[ "$REF" == refs/tags/v* ]]; then
            CHANNEL=latest
          elif [[ "$REF" == "refs/heads/${{ env.BETA_BRANCH }}" ]]; then
            CHANNEL=beta
          elif [[ "$REF" == "refs/heads/${{ env.STABLE_BRANCH }}" ]]; then
            CHANNEL=dev
          else
            CHANNEL=local
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Docs channel: $CHANNEL"

      - name: Export OpenAPI schema
        env:
          DJANGO_SETTINGS_MODULE: cms.docs_settings
          SECRET_KEY: docs-build-not-a-secret
        run: |
          mkdir -p docs/en/reference
          if python manage.py generate_swagger -f yaml -o docs/en/reference/openapi.yaml 2>/tmp/swagger.err; then
            echo "OpenAPI schema exported"
          else
            echo "OpenAPI export skipped; using stub if present"
            cat /tmp/swagger.err || true
            python scripts/prepare_docs_build.py
          fi

      - name: Prepare generated pages
        env:
          DOCS_CHANNEL: ${{ steps.channel.outputs.channel }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python scripts/prepare_docs_build.py

      - name: Check scenarios
        run: python scripts/check_doc_scenarios.py

      - name: Build site
        run: mkdocs build --strict

      - name: Upload site artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install docs tools
        run: pip install -r requirements-docs.txt

      - name: Install app dependencies for OpenAPI export
        run: pip install -r requirements.txt
        continue-on-error: true

      - name: Resolve docs channel
        id: channel
        run: |
          REF="${{ github.ref }}"
          if [[ "$REF" == refs/tags/v* ]]; then
            CHANNEL=latest
          elif [[ "$REF" == "refs/heads/${{ env.BETA_BRANCH }}" ]]; then
            CHANNEL=beta
          elif [[ "$REF" == "refs/heads/${{ env.STABLE_BRANCH }}" ]]; then
            CHANNEL=dev
          else
            CHANNEL=local
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Export OpenAPI schema
        env:
          DJANGO_SETTINGS_MODULE: cms.docs_settings
          SECRET_KEY: docs-build-not-a-secret
        run: |
          mkdir -p docs/en/reference
          python manage.py generate_swagger -f yaml -o docs/en/reference/openapi.yaml || python scripts/prepare_docs_build.py

      - name: Prepare generated pages
        env:
          DOCS_CHANNEL: ${{ steps.channel.outputs.channel }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python scripts/prepare_docs_build.py

      - name: Check scenarios
        run: python scripts/check_doc_scenarios.py

      - name: Deploy with mike
        env:
          DOCS_CHANNEL: ${{ steps.channel.outputs.channel }}
        run: |
          VERSION=$(python -c "import json; print(json.load(open('package.json'))['version'])")
          REF="${{ github.ref }}"
          if [[ "$REF" == refs/tags/v* ]]; then
            mike deploy --push --update-aliases "$VERSION" latest
            mike set-default --push latest
          elif [[ "$REF" == "refs/heads/${{ env.BETA_BRANCH }}" ]]; then
            mike deploy --push --update-aliases beta
          elif [[ "$REF" == "refs/heads/${{ env.STABLE_BRANCH }}" ]]; then
            mike deploy --push --update-aliases dev
          else
            mike deploy --push --update-aliases "$VERSION"
          fi
