apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mediacms

# Reference the base configuration (production uses defaults)
resources:
- ../../base

# Production-specific labels
labels:
- includeSelectors: true
  pairs:
    app.kubernetes.io/environment: prod
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: mediacms
    app.kubernetes.io/part-of: mediacms

# Example production patches (commented out; copy to ./patches/ and reference via `patches:` if desired)
#
# # Scale web + uWSGI replicas
# apiVersion: apps/v1
# kind: Deployment
# metadata:
#   name: web
#   namespace: mediacms
# spec:
#   replicas: 3
# ---
# apiVersion: apps/v1
# kind: Deployment
# metadata:
#   name: uwsgi
#   namespace: mediacms
# spec:
#   replicas: 2
#
# # Increase uWSGI resources
# apiVersion: apps/v1
# kind: Deployment
# metadata:
#   name: uwsgi
#   namespace: mediacms
# spec:
#   template:
#     spec:
#       containers:
#       - name: mediacms
#         resources:
#           requests:
#             cpu: "1000m"
#             memory: "2Gi"
#           limits:
#             cpu: "4000m"
#             memory: "4Gi"
#
