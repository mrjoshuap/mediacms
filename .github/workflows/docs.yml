name: Documentation

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install docs tools
        run: pip install -r requirements-docs.txt

      - name: Install app dependencies for OpenAPI export
        run: |
          pip install -r requirements.txt
        continue-on-error: true

      - name: Export OpenAPI schema
        env:
          DJANGO_SETTINGS_MODULE: cms.docs_settings
          SECRET_KEY: docs-build-not-a-secret
        run: |
          mkdir -p docs/en/reference
          if python manage.py generate_swagger -f yaml -o docs/en/reference/openapi.yaml 2>/tmp/swagger.err; then
            echo "OpenAPI schema exported"
          else
            echo "OpenAPI export skipped; using stub if present"
            cat /tmp/swagger.err || true
            python scripts/prepare_docs_build.py
          fi

      - name: Prepare generated pages
        env:
          DOCS_CHANNEL: ${{ github.event_name == 'pull_request' && 'pr' || (startsWith(github.ref, 'refs/tags/v') && 'latest' || (github.ref == 'refs/heads/main' && 'dev' || 'local')) }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python scripts/prepare_docs_build.py

      - name: Check scenarios
        run: python scripts/check_doc_scenarios.py

      - name: Build site
        run: mkdocs build --strict

      - name: Upload site artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install docs tools
        run: pip install -r requirements-docs.txt

      - name: Install app dependencies for OpenAPI export
        run: pip install -r requirements.txt
        continue-on-error: true

      - name: Export OpenAPI schema
        env:
          DJANGO_SETTINGS_MODULE: cms.docs_settings
          SECRET_KEY: docs-build-not-a-secret
        run: |
          mkdir -p docs/en/reference
          python manage.py generate_swagger -f yaml -o docs/en/reference/openapi.yaml || python scripts/prepare_docs_build.py

      - name: Prepare generated pages
        env:
          DOCS_CHANNEL: ${{ startsWith(github.ref, 'refs/tags/v') && 'latest' || (github.ref == 'refs/heads/main' && 'dev' || 'local') }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python scripts/prepare_docs_build.py

      - name: Check scenarios
        run: python scripts/check_doc_scenarios.py

      - name: Deploy with mike
        env:
          DOCS_CHANNEL: ${{ startsWith(github.ref, 'refs/tags/v') && 'latest' || (github.ref == 'refs/heads/main' && 'dev' || 'local') }}
        run: |
          VERSION=$(python -c "import json; print(json.load(open('package.json'))['version'])")
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            mike deploy --push --update-aliases "$VERSION" latest
            mike set-default --push latest
          elif [[ "${{ github.ref }}" == refs/heads/main ]]; then
            mike deploy --push --update-aliases dev
          else
            mike deploy --push --update-aliases "$VERSION" latest
            mike set-default --push latest
          fi
