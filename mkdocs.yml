site_name: MediaCMS Documentation
site_description: Guides for MediaCMS users, operators, administrators, and developers
site_url: https://mrjoshuap.github.io/mediacms/
repo_url: https://github.com/mediacms-io/mediacms
repo_name: mediacms-io/mediacms
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
    name: material
    language: en
    palette:
        - media: '(prefers-color-scheme)'
          toggle:
              icon: material/brightness-auto
              name: Switch to light mode
        - media: '(prefers-color-scheme: light)'
          scheme: default
          primary: indigo
          accent: indigo
          toggle:
              icon: material/brightness-7
              name: Switch to dark mode
        - media: '(prefers-color-scheme: dark)'
          scheme: slate
          primary: indigo
          accent: indigo
          toggle:
              icon: material/brightness-4
              name: Switch to system preference
    features:
        - navigation.tabs
        - navigation.sections
        - navigation.top
        - navigation.indexes
        - search.suggest
        - search.highlight
        - content.code.copy
        - toc.follow

plugins:
    - search
    - i18n:
          docs_structure: folder
          fallback_to_default: true
          reconfigure_material: true
          languages:
              - locale: en
                default: true
                name: English
                build: true
    - mkdocstrings:
          handlers:
              python:
                  paths: [.]
                  options:
                      docstring_style: google
                      show_source: true
                      members_order: source
    - swagger-ui-tag
    - mike:
          canonical_version: latest

markdown_extensions:
    - admonition
    - attr_list
    - md_in_html
    - tables
    - toc:
          permalink: true
    - pymdownx.details
    - pymdownx.superfences:
          custom_fences:
              - name: mermaid
                class: mermaid
                format: !!python/name:pymdownx.superfences.fence_code_format
    - pymdownx.highlight:
          anchor_linenums: true
    - pymdownx.inlinehilite
    - pymdownx.snippets
    - pymdownx.tabbed:
          alternate_style: true

extra_css:
    - stylesheets/extra.css

extra:
    version:
        provider: mike
    social:
        - icon: fontawesome/brands/github
          link: https://github.com/mediacms-io/mediacms

