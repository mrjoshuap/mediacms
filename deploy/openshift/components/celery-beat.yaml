apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: mediacms
  labels:
    app.kubernetes.io/name: mediacms
    app.kubernetes.io/component: celery-beat
    app.kubernetes.io/part-of: mediacms
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mediacms
      app.kubernetes.io/component: celery-beat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mediacms
        app.kubernetes.io/component: celery-beat
        app.kubernetes.io/part-of: mediacms
        app.kubernetes.io/managed-by: argocd
    spec:
      containers:
      - name: mediacms
        image: image-registry.openshift-image-registry.svc:5000/mediacms/mediacms-base:latest
        imagePullPolicy: IfNotPresent
        command: ["./deploy/openshift/scripts/entrypoint.sh"]
        args: ["./deploy/openshift/scripts/start.sh"]
        env:
        - name: ENABLE_UWSGI
          value: "no"
        - name: ENABLE_NGINX
          value: "no"
        - name: ENABLE_CELERY_BEAT
          value: "yes"
        - name: ENABLE_CELERY_SHORT
          value: "no"
        - name: ENABLE_CELERY_LONG
          value: "no"
        - name: ENABLE_MIGRATIONS
          value: "no"
        envFrom:
        - configMapRef:
            name: mediacms-config
        - secretRef:
            name: mediacms-secrets
        volumeMounts:
        - name: media-files
          mountPath: /home/mediacms.io/mediacms/media_files
        - name: local-settings
          mountPath: /home/mediacms.io/mediacms/cms/local_settings.py
          subPath: local_settings.py
          readOnly: true
        - name: imagemagick-policy
          mountPath: /etc/ImageMagick-6/policy.xml
          subPath: policy.xml
          readOnly: true
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "ps aux | grep -v grep | grep celery.*beat || exit 1"
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "ps aux | grep -v grep | grep celery.*beat || exit 1"
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: media-files
        persistentVolumeClaim:
          claimName: media-files-pvc
      - name: local-settings
        configMap:
          name: mediacms-config
      - name: imagemagick-policy
        configMap:
          name: imagemagick-policy
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
