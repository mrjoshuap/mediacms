apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mediacms-prod

# Reference the base configuration (production uses defaults)
resources:
- ../../base

patches:
- path: patches/namespace.yaml
- path: patches/route.yaml
- path: patches/replicas.yaml
- path: patches/resources.yaml
- path: patches/storage.yaml
- path: patches/storage-class.yaml

# Production-specific labels
labels:
- includeSelectors: true
  pairs:
    app.kubernetes.io/environment: prod
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: mediacms
    app.kubernetes.io/part-of: mediacms
