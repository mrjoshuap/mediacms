name: Documentation

# Branch roles (set as GitHub Actions repository variables when forking):
#   MEDIACMS_STABLE_BRANCH  — production line (default: main)
#   MEDIACMS_BETA_BRANCH    — beta / next line (default: mediacms-next)
# Triggers list both names so forks work before variables exist.
# `on:` cannot read vars, so keep the branch list in sync with those defaults.
#
# GitHub Pages is configured as "GitHub Actions" (not "Deploy from a branch").
# mike still pushes versioned docs to the gh-pages branch; this workflow then
# uploads that tree with actions/deploy-pages so https://<user>.github.io/<repo>/
# is published.

on:
  push:
    branches: [main, mediacms-next]
    # Upstream semver (v9.4.0) and fork stamp tags (v10.0.0.20251114[.N])
    tags: ["v*.*.*", "v*.*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: false

env:
  STABLE_BRANCH: ${{ vars.MEDIACMS_STABLE_BRANCH || 'main' }}
  BETA_BRANCH: ${{ vars.MEDIACMS_BETA_BRANCH || 'mediacms-next' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install docs tools
        run: pip install -r requirements-docs.txt

      - name: Install app dependencies for OpenAPI export
        run: |
          pip install -r requirements.txt
        continue-on-error: true

      - name: Resolve docs channel
        id: channel
        run: |
          REF="${{ github.ref }}"
          DOC_VERSION=""
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            CHANNEL=pr
          elif [[ "$REF" == refs/tags/v* ]]; then
            TAG="${REF#refs/tags/}"
            git fetch origin "${{ env.STABLE_BRANCH }}" "${{ env.BETA_BRANCH }}" || true
            if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]{8}(\.[0-9]+)?$ ]]; then
              DOC_VERSION="${TAG#v}"
              if git merge-base --is-ancestor "${GITHUB_SHA}" "origin/${{ env.STABLE_BRANCH }}"; then
                CHANNEL=latest
              else
                CHANNEL=beta
              fi
            else
              CHANNEL=latest
            fi
          elif [[ "$REF" == "refs/heads/${{ env.BETA_BRANCH }}" ]]; then
            CHANNEL=beta
          elif [[ "$REF" == "refs/heads/${{ env.STABLE_BRANCH }}" ]]; then
            CHANNEL=dev
          else
            CHANNEL=local
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "doc_version=$DOC_VERSION" >> "$GITHUB_OUTPUT"
          echo "Docs channel: $CHANNEL version=${DOC_VERSION:-package.json}"

      - name: Export OpenAPI schema
        env:
          DJANGO_SETTINGS_MODULE: cms.docs_settings
          SECRET_KEY: docs-build-not-a-secret
        run: |
          mkdir -p docs/en/reference
          # Stub so mkdocstrings/griffe can import cms.settings without a real local_settings.py
          touch cms/local_settings.py
          if python manage.py generate_swagger -f yaml -o docs/en/reference/openapi.yaml 2>/tmp/swagger.err; then
            echo "OpenAPI schema exported"
          else
            echo "OpenAPI export skipped; using stub if present"
            cat /tmp/swagger.err || true
            python scripts/prepare_docs_build.py
          fi

      - name: Prepare generated pages
        env:
          DOCS_CHANNEL: ${{ steps.channel.outputs.channel }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python scripts/prepare_docs_build.py

      - name: Check scenarios
        run: python scripts/check_doc_scenarios.py

      - name: Build site
        run: mkdocs build --strict

      - name: Upload site artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install docs tools
        run: pip install -r requirements-docs.txt

      - name: Install app dependencies for OpenAPI export
        run: pip install -r requirements.txt
        continue-on-error: true

      - name: Resolve docs channel
        id: channel
        run: |
          REF="${{ github.ref }}"
          DOC_VERSION=""
          if [[ "$REF" == refs/tags/v* ]]; then
            TAG="${REF#refs/tags/}"
            git fetch origin "${{ env.STABLE_BRANCH }}" "${{ env.BETA_BRANCH }}" || true
            if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]{8}(\.[0-9]+)?$ ]]; then
              DOC_VERSION="${TAG#v}"
              if git merge-base --is-ancestor "${GITHUB_SHA}" "origin/${{ env.STABLE_BRANCH }}"; then
                CHANNEL=latest
              else
                CHANNEL=beta
              fi
            else
              CHANNEL=latest
            fi
          elif [[ "$REF" == "refs/heads/${{ env.BETA_BRANCH }}" ]]; then
            CHANNEL=beta
          elif [[ "$REF" == "refs/heads/${{ env.STABLE_BRANCH }}" ]]; then
            CHANNEL=dev
          else
            CHANNEL=local
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "doc_version=$DOC_VERSION" >> "$GITHUB_OUTPUT"

      - name: Export OpenAPI schema
        env:
          DJANGO_SETTINGS_MODULE: cms.docs_settings
          SECRET_KEY: docs-build-not-a-secret
        run: |
          mkdir -p docs/en/reference
          # Stub so mkdocstrings/griffe can import cms.settings without a real local_settings.py
          touch cms/local_settings.py
          python manage.py generate_swagger -f yaml -o docs/en/reference/openapi.yaml || python scripts/prepare_docs_build.py

      - name: Prepare generated pages
        env:
          DOCS_CHANNEL: ${{ steps.channel.outputs.channel }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python scripts/prepare_docs_build.py

      - name: Check scenarios
        run: python scripts/check_doc_scenarios.py

      - name: Deploy versions with mike
        env:
          DOCS_CHANNEL: ${{ steps.channel.outputs.channel }}
        run: |
          set -euo pipefail
          if [[ -n "${{ steps.channel.outputs.doc_version }}" ]]; then
            VERSION="${{ steps.channel.outputs.doc_version }}"
          else
            VERSION=$(python -c "import json; print(json.load(open('package.json'))['version'])")
          fi
          CHANNEL="${{ steps.channel.outputs.channel }}"
          echo "mike deploy channel=$CHANNEL version=$VERSION"

          if [[ "$CHANNEL" == "latest" ]]; then
            mike deploy --push --update-aliases "$VERSION" latest
            mike set-default --push latest
          elif [[ "$CHANNEL" == "beta" ]]; then
            mike deploy --push --update-aliases beta
            # Until a stable/latest docs set exists, make / serve beta.
            mike set-default --push beta
          elif [[ "$CHANNEL" == "dev" ]]; then
            mike deploy --push --update-aliases dev
            # Prefer latest if present; otherwise leave existing default.
            if mike list | grep -qE '(^| )latest( |$)'; then
              mike set-default --push latest
            else
              mike set-default --push dev
            fi
          else
            mike deploy --push --update-aliases "$VERSION"
          fi

      - name: Prepare Pages artifact from gh-pages
        run: |
          set -euo pipefail
          rm -rf _pages
          git fetch origin gh-pages
          git worktree add _pages origin/gh-pages
          # GitHub Pages artifact must not include .git
          rm -rf _pages/.git
          ls -la _pages
          test -f _pages/versions.json
          test -d _pages/beta -o -d _pages/latest -o -d _pages/dev

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
